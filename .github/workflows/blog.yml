name: blog-auto-publish

on:
  schedule:
    # KST 08:00 / 12:30 / 17:00 (UTC 23:00 / 03:30 / 08:00) — 하루 3회 발행
    - cron: "0 23 * * *"
    - cron: "30 3 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      brand:
        description: "브랜드 콘텐츠 발행 (키워드 타깃)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Generate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # 하루 3회 중 아침(KST 08:00) 슬롯은 브랜드 키워드 콘텐츠
        run: |
          FLAG=""
          if [ "${{ github.event.schedule }}" = "0 23 * * *" ] || [ "${{ inputs.brand }}" = "true" ]; then FLAG="--brand"; fi
          echo "mode: ${FLAG:-normal}"
          node tools/generate-post.mjs $FLAG

      - name: Commit & push
        run: |
          git config user.name "saenru-bot"
          git config user.email "zzangusz2@naver.com"
          git add blog en sitemap.xml
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "blog: 자동 발행 $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)"
          git push
